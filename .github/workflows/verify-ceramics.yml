name: Verify live gift guide
on:
  push:
    branches: [qa/november-ceramics-display]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check the public storefront
        run: |
          npm install --prefix "$RUNNER_TEMP/gift-browser" --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/gift-browser/node_modules" node scripts/check-shopping.cjs
        env:
          TEST_URL: https://gifts.bakinggreatbread.com
          CHROME_BIN: /usr/bin/google-chrome
      - name: Keep viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-viewports
          path: qa/shopping/*.png
          retention-days: 3
