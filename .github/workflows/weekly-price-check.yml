name: Weekly price check
on:
  schedule: [{ cron: "0 13 * * 1" }]
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: run
        run: node scripts/check-prices.mjs --out price-report.md || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.changed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "Gift guide prices changed $(date +%F)" --body-file price-report.md
